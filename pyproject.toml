[project]
name = "cityx"
version = "0.1.0"
description = "TechTO Fast & Frugal hotel booker: APIs + phone call + email receipt"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.scripts]
cityx = "cityx.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cityx = ["static/*"]
